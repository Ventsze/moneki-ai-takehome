<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>合味餐饮 · 经营看板</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --ink: #1f2933; --muted: #6b7683;
    --line: #e4e9f0; --brand: #2563eb; --brand-soft: #eff4ff;
    --good: #16855b; --bad: #c2410c; --warn: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 28px; display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 28px 60px; }
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: end;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 16px;
  }
  .filters label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .filters select, .filters input {
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px;
    font-size: 13px; background: #fff; min-width: 130px;
  }
  .filters button {
    background: var(--brand); color: #fff; border: 0; border-radius: 7px;
    padding: 7px 18px; font-size: 13px; cursor: pointer;
  }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px;
  }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .card .v small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 10px; }
  .grid2 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--line); padding: 6px 8px; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; border-radius: 20px; padding: 1px 9px; font-size: 11px;
    background: var(--brand-soft); color: var(--brand); margin-left: 6px;
  }
  .dq-list { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink); }
  .dq-list li { margin: 3px 0; }
  .dq-list b { color: var(--bad); font-weight: 600; }
  .kv { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  /* 聊天 */
  .chat-log { display: flex; flex-direction: column; gap: 12px; max-height: 480px; overflow-y: auto; padding: 4px 2px; }
  .msg { max-width: 92%; border-radius: 10px; padding: 10px 13px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: #f0f3f8; border-bottom-left-radius: 3px; }
  .msg .type { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .msg .cites { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; font-size: 12.5px; }
  .msg .cites .doc { color: var(--brand); font-weight: 600; }
  .msg .cites blockquote { margin: 4px 0; padding: 4px 10px; border-left: 3px solid var(--brand); background: #fff; color: var(--ink); }
  .msg details { margin-top: 7px; font-size: 12px; color: var(--muted); }
  .msg details pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow-x: auto; font-size: 11.5px; }
  .chat-input { display: flex; gap: 8px; margin-top: 12px; }
  .chat-input input { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: 13.5px; }
  .chat-input button { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 0 22px; cursor: pointer; }
  .chat-samples { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chat-samples span { font-size: 12px; color: var(--brand); background: var(--brand-soft); border-radius: 14px; padding: 3px 11px; cursor: pointer; }
  .trace-steps { margin: 10px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  .trace-steps li { margin: 2px 0; }
  .trace-steps code { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .alert-banner { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
  .alert-banner h2 { color: var(--warn); }
  .alert-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px dashed #fed7aa; font-size: 13px; }
  .alert-item:first-of-type { border-top: 0; }
  .alert-tag { flex: none; font-size: 11px; border-radius: 12px; padding: 1px 9px; background: #ffedd5; color: var(--warn); }
  .alert-item .q { flex: 1; color: var(--muted); }
  .alert-item button { flex: none; border: 0; background: var(--warn); color: #fff; border-radius: 7px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
  .presets { display: flex; gap: 6px; }
  .presets span { font-size: 12px; color: var(--brand); background: var(--brand-soft); border-radius: 12px; padding: 3px 10px; cursor: pointer; }
  .compare-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .cmp { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .cmp .k { font-size: 12px; color: var(--muted); }
  .cmp .v { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .up { color: var(--good); } .down { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>合味餐饮 · 经营看板</h1>
  <span class="sub" id="head-sub">加载中…</span>
</header>
<main>
  <div class="filters">
    <div><label>开始日期</label><input type="date" id="f-start"></div>
    <div><label>结束日期</label><input type="date" id="f-end"></div>
    <div><label>门店</label><select id="f-store"><option value="">全部门店</option></select></div>
    <div><label>商品（Top 榜用）</label><select id="f-product"><option value="">全部商品</option></select></div>
    <button id="apply">查询</button>
    <div class="presets" id="presets">
      <span data-days="7">近 7 天</span><span data-days="30">近 30 天</span>
      <span data-preset="current">全部数据</span><span data-preset="prev-month">上月</span>
    </div>
  </div>

  <div class="alert-banner" id="alert-banner" style="display:none">
    <h2>⚠ 运营预警</h2>
    <div id="alert-list"></div>
  </div>

  <div class="cards" id="summary-cards"></div>

  <div class="compare-strip" id="compare-strip"></div>

  <div class="grid2">
    <div class="panel"><h2>净营业额趋势</h2><div id="trend"></div></div>
    <div class="panel">
      <h2>数据质量</h2>
      <ul class="dq-list" id="dq-list"></ul>
      <div class="kv" id="dq-kv"></div>
    </div>
  </div>

  <div class="panel"><h2>Top 10 商品（按净营业额）</h2><div id="top-table"></div></div>

  <div class="panel">
    <h2>AI 助手 <span class="badge" id="llm-mode"></span></h2>
    <div class="chat-log" id="chat-log"></div>
    <div class="chat-input">
      <input id="chat-q" placeholder="问点什么，例如：S03 六月第二周营业额为什么这么低？">
      <button id="chat-send">发送</button>
    </div>
    <div class="chat-samples">
      <span>牛肉poke 六月卖了多少钱？</span>
      <span>外卖订单多久内可以退款？</span>
      <span>618 当天 S02 的牛肉poke 卖了多少份，达到目标了吗？</span>
      <span>储值充值现在的赠送规则是什么？</span>
    </div>
    <ol class="trace-steps" id="trace-steps"></ol>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const session = "ui-" + Math.random().toString(36).slice(2, 10);
let meta = null;

const fmtMoney = (v) => Number(v).toLocaleString("zh-CN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function loadMeta() {
  meta = await (await fetch("/api/meta")).json();
  const { start, end } = meta.data_period;
  $("f-start").value = start; $("f-end").value = end;
  $("head-sub").textContent =
    "业务基准日 " + meta.today + "（按公司口径固定，当前真实时间与此无关） · 数据区间 " + start + " ~ " + end;
  for (const s of meta.stores) {
    $("f-store").insertAdjacentHTML("beforeend", `<option value="${esc(s.store_id)}">${esc(s.store_id)} ${esc(s.store_name)}</option>`);
  }
  for (const p of meta.products) {
    $("f-product").insertAdjacentHTML("beforeend", `<option value="${esc(p.product_id)}">${esc(p.product_id)} ${esc(p.product_name)}</option>`);
  }
}

function params() {
  const p = { start: $("f-start").value, end: $("f-end").value };
  if ($("f-store").value) p.store_id = $("f-store").value;
  if ($("f-product").value) p.product_id = $("f-product").value;
  return p;
}

async function loadSummary() {
  const body = await (await fetch("/api/metrics/summary?" + new URLSearchParams(params()))).json();
  $("summary-cards").innerHTML = [
    ["净营业额", "¥" + fmtMoney(body.net_revenue)],
    ["退款金额", "¥" + fmtMoney(body.refund_amount)],
    ["有效订单", body.orders.toLocaleString() + " <small>单</small>"],
    ["客单价", body.aov == null ? "—" : "¥" + body.aov.toFixed(2)],
    ["销量", body.qty.toLocaleString() + " <small>件</small>"],
  ].map(([k, v]) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

async function loadTrend() {
  const body = await (await fetch("/api/metrics/daily?" + new URLSearchParams(params()))).json();
  const days = body.days.filter((d) => d.date);
  const W = 800, H = 240, PAD = { l: 64, r: 14, t: 14, b: 30 };
  $("trend").innerHTML = "";
  if (!days.length) { $("trend").textContent = "该区间没有数据"; return; }
  const max = Math.max(...days.map((d) => d.net_revenue), 1);
  const x = (i) => PAD.l + (W - PAD.l - PAD.r) * (days.length === 1 ? 0.5 : i / (days.length - 1));
  const y = (v) => H - PAD.b - (H - PAD.t - PAD.b) * (v / max);
  const pts = days.map((d, i) => `${x(i).toFixed(1)},${y(d.net_revenue).toFixed(1)}`);
  const gridY = [0, 0.25, 0.5, 0.75, 1].map((r) => [y(max * r), fmtMoney(max * r)]);
  const ticks = [];
  const step = Math.max(1, Math.ceil(days.length / 8));
  days.forEach((d, i) => { if (i % step === 0) ticks.push(`<text x="${x(i)}" y="${H - 8}" font-size="10" fill="#6b7683" text-anchor="middle">${d.date.slice(5)}</text>`); });
  $("trend").innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridY.map(([yy, label]) => `<line x1="${PAD.l}" y1="${yy}" x2="${W - PAD.r}" y2="${yy}" stroke="#eef1f6"/><text x="${PAD.l - 8}" y="${yy + 3}" font-size="10" fill="#6b7683" text-anchor="end">${label}</text>`).join("")}
    <polygon points="${PAD.l},${y(0)} ${pts.join(" ")} ${x(days.length - 1)},${y(0)}" fill="url(#g)"/>
    <polyline points="${pts.join(" ")}" fill="none" stroke="#2563eb" stroke-width="2"/>
    ${days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.net_revenue)}" r="2.6" fill="#2563eb"><title>${d.date} 净营业额 ¥${fmtMoney(d.net_revenue)} · ${d.orders} 单</title></circle>`).join("")}
    ${ticks.join("")}
  </svg>`;
}

async function loadTop() {
  const p = params();
  const body = await (await fetch("/api/metrics/top?" + new URLSearchParams(p))).json();
  const rows = body.products.map((r, i) => `
    <tr><td>${i + 1}</td><td>${esc(r.product_id)}</td><td>${esc(r.product_name ?? "")}</td>
    <td>${esc(r.product_category ?? "")}</td>
    <td class="num">¥${fmtMoney(r.net_revenue)}</td><td class="num">${r.orders}</td><td class="num">${r.qty}</td></tr>`);
  $("top-table").innerHTML = `<table>
    <tr><th>#</th><th>编号</th><th>商品</th><th>品类</th><th class="num">净营业额</th><th class="num">订单</th><th class="num">销量</th></tr>
    ${rows.join("") || "<tr><td colspan=7>没有数据</td></tr>"}</table>`;
}

async function loadCompare() {
  const p = params();
  const body = await (await fetch("/api/metrics/compare?" + new URLSearchParams(p))).json();
  // 上一等长区间没有数据时（如所选区间覆盖了数据起点），pct 为 null：
  // 显示"—"并注明，而不是渲染 null% 或误导性的巨大差额。
  const prevHasData = body.period_a.net_revenue > 0 || body.period_a.orders > 0;
  const sub = prevHasData ? "vs 上一等长区间" : "上一等长区间无数据";
  const cell = (label, cur, prev, fmt) => {
    if (!prevHasData) {
      return `<div class="cmp"><div class="k">${label} 环比</div><div class="v">${fmt(cur)}</div>
        <div style="font-size:12px;color:var(--muted)">${sub}</div></div>`;
    }
    const d = cur - prev;
    const cls = d > 0 ? "up" : d < 0 ? "down" : "";
    const sign = d > 0 ? "+" : "";
    return `<div class="cmp"><div class="k">${label} 环比</div><div class="v">${fmt(cur)}</div>
      <div class="${cls}" style="font-size:12px">${sign}${fmt(d).replace("¥", "")} ${sub}</div></div>`;
  };
  const pctCell = (label, pct) => {
    if (pct == null) {
      return `<div class="cmp"><div class="k">${label} 环比</div><div class="v">—</div>
        <div style="font-size:12px;color:var(--muted)">${sub}</div></div>`;
    }
    const cls = pct > 0 ? "up" : pct < 0 ? "down" : "";
    return `<div class="cmp"><div class="k">${label} 环比</div><div class="v ${cls}">${pct > 0 ? "+" : ""}${pct}%</div><div style="font-size:12px;color:var(--muted)">${sub}</div></div>`;
  };
  $("compare-strip").innerHTML =
    cell("净营业额", body.period_b.net_revenue, body.period_a.net_revenue, (v) => "¥" + fmtMoney(v)) +
    pctCell("净营业额", body.delta.net_revenue.pct) +
    pctCell("订单数", body.delta.orders.pct) +
    pctCell("销量", body.delta.qty.pct);
}

const KIND_CN = { closed_day: "营业中断", month_drop: "环比骤跌", refund_spike: "退款集中" };
async function loadAnomalies() {
  const body = await (await fetch("/api/anomalies")).json();
  const items = body.anomalies || [];
  if (!items.length) { $("alert-banner").style.display = "none"; return; }
  $("alert-banner").style.display = "";
  $("alert-list").innerHTML = items.map((a) => `
    <div class="alert-item">
      <span class="alert-tag">${KIND_CN[a.kind] || a.kind}</span>
      <b>${esc(a.store_id || "")} ${esc(a.date)}</b>
      <span class="q">${esc(
        a.kind === "month_drop" ? "净营业额环比 " + a.detail.pct + "%"
        : a.kind === "refund_spike" ? "当日退款 ¥" + fmtMoney(a.detail.refund)
        : (a.detail?.note || "")
      )}</span>
      <button data-q="${esc(a.question)}">问 AI 为什么</button>
    </div>`).join("");
  document.querySelectorAll(".alert-item button").forEach((btn) => {
    btn.onclick = () => ask(btn.dataset.q);
  });
}

async function loadDQ() {
  const dq = await (await fetch("/api/data_quality")).json();
  const cr = dq.cleaning_report || {};
  const removed = cr.removed || {};
  $("dq-list").innerHTML = Object.entries(removed)
    .map(([k, v]) => `<li>${k.replace(/_/g, " ")}：<b>${v}</b> 行</li>`).join("")
    + `<li>保留明细：<b style="color:var(--good)">${cr.kept_rows ?? "—"}</b> 行（销售 ${cr.kept_sales_rows ?? "—"} + 退款 ${cr.kept_refund_rows ?? "—"}）</li>`;
  const h = await (await fetch("/api/health")).json();
  $("llm-mode").textContent = h.llm_mode === "live" ? "在线模型" : "本地降级模式";
  $("dq-kv").textContent = `知识库 ${h.kb_docs} 篇 / ${h.kb_chunks} 个片段 · 有效销售行 ${h.valid_sales_rows}`;
}

function addMsg(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  $("chat-log").appendChild(div);
  $("chat-log").scrollTop = $("chat-log").scrollHeight;
  return div;
}

const TYPE_CN = { data: "查数据", doc: "查文档", hybrid: "数据+文档", refusal: "拒答", clarify: "需要补充" };

async function ask(question) {
  addMsg("user", esc(question));
  const holder = addMsg("bot", "思考中…");
  try {
    const body = await (await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: session, question }),
    })).json();
    let html = esc(body.answer) + `<div class="type">${TYPE_CN[body.answer_type] || body.answer_type}</div>`;
    if (body.citations?.length) {
      html += `<div class="cites">` + body.citations.map((c) =>
        `<div><span class="doc">${esc(c.doc_id)}</span><blockquote>${esc(c.quote)}</blockquote></div>`).join("") + `</div>`;
    }
    if (body.data_evidence?.length) {
      html += `<details><summary>数据证据</summary><pre>${esc(JSON.stringify(body.data_evidence, null, 1))}</pre></details>`;
    }
    holder.innerHTML = html;
    if (body.trace_id) loadTrace(body.trace_id);
  } catch (e) {
    holder.textContent = "请求失败：" + e;
  }
}

async function loadTrace(traceId) {
  const res = await fetch("/api/trace/" + traceId);
  if (!res.ok) { $("trace-steps").innerHTML = `<li>trace ${esc(traceId)} 不存在</li>`; return; }
  const trace = await res.json();
  const steps = trace.steps || [];
  $("trace-steps").innerHTML =
    `<li>trace <code>${esc(traceId)}</code> · 共 ${steps.length} 步</li>` +
    steps.map((s) => `<li>${esc(s.step || s.name || "?")} <code>${(s.ms ?? s.elapsed_ms ?? 0)}ms</code></li>`).join("");
}

$("apply").onclick = () => { loadSummary(); loadTrend(); loadTop(); loadCompare(); };
document.querySelectorAll("#presets span").forEach((el) => {
  el.onclick = () => {
    const end = new Date(meta.data_period.end + "T00:00:00");
    if (el.dataset.days) {
      const start = new Date(end);
      start.setDate(start.getDate() - Number(el.dataset.days) + 1);
      $("f-start").value = start.toISOString().slice(0, 10);
      $("f-end").value = meta.data_period.end;
    } else if (el.dataset.preset === "current") {
      $("f-start").value = meta.data_period.start;
      $("f-end").value = meta.data_period.end;
    } else if (el.dataset.preset === "prev-month") {
      const d = new Date(end);
      d.setDate(1); d.setDate(d.getDate() - 1);
      const last = d.toISOString().slice(0, 10);
      $("f-start").value = last.slice(0, 8) + "01";
      $("f-end").value = last;
    }
    loadSummary(); loadTrend(); loadTop(); loadCompare();
  };
});
$("chat-send").onclick = () => { const q = $("chat-q").value.trim(); if (q) { ask(q); $("chat-q").value = ""; } };
$("chat-q").addEventListener("keydown", (e) => { if (e.key === "Enter") $("chat-send").click(); });
document.querySelectorAll(".chat-samples span").forEach((el) => { el.onclick = () => ask(el.textContent); });

loadMeta().then(() => { loadSummary(); loadTrend(); loadTop(); loadDQ(); loadCompare(); loadAnomalies(); });
</script>
</body>
</html>
